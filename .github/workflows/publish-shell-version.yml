name: Release Xray

on:
  workflow_dispatch:
    inputs:
      details:
        description: Release summary
        required: false
        type: string

concurrency:
  group: release-xray
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.subject.outputs.version }}
      install_sha: ${{ steps.subject.outputs.install_sha }}
      bundle_sha: ${{ steps.subject.outputs.bundle_sha }}
      candidate_commit: ${{ steps.subject.outputs.candidate_commit }}
      canonical_commit: ${{ steps.subject.outputs.canonical_commit }}
      canonical_digest: ${{ steps.subject.outputs.canonical_digest }}
      canonical_bundle_sha: ${{ steps.subject.outputs.canonical_bundle_sha }}
    steps:
      - name: Checkout exact dispatch candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Read canonical pin
        id: pin
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, pathlib
          pin=json.loads(pathlib.Path('repository_files/rill_integration/RILL_CANONICAL_PIN.json').read_text())
          print(f"canonical_commit={pin['canonicalCommit']}")
          print(f"canonical_digest={pin['canonicalDigest']}")
          PY

      - name: Checkout pinned canonical source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: hello-yunshu/rill-xray-agent
          ref: ${{ steps.pin.outputs.canonical_commit }}
          path: .canonical
          persist-credentials: false

      - name: Validate immutable candidate and host bytes
        id: subject
        env:
          EXPECTED_CANONICAL_COMMIT: ${{ steps.pin.outputs.canonical_commit }}
          EXPECTED_CANONICAL_DIGEST: ${{ steps.pin.outputs.canonical_digest }}
          INPUT_DETAILS: ${{ inputs.details }}
        run: |
          set -euo pipefail
          bash -n install.sh
          bash -n scripts/*.sh
          python3 .github/test/test_release_automation.py
          python3 .github/test/test_convergence.py
          python3 .github/test/test_geo_update_transaction.py
          version=$(sed -n 's/^shell_version="\([0-9][0-9.]*\)"$/\1/p' install.sh)
          [[ -n "$version" ]] || { echo 'shell_version missing'; exit 1; }
          candidate_commit=$(git rev-parse HEAD)
          [[ "$candidate_commit" == "$GITHUB_SHA" ]] || { echo 'candidate SHA drift'; exit 1; }
          python3 .canonical/integrations/xray_bash_onekey/tools/verify_xray_payload.py \
            . .canonical/integrations/xray_bash_onekey/CANONICAL_MANIFEST.json \
            --expected-canonical-digest "$EXPECTED_CANONICAL_DIGEST"
          bundle=assets/rill-xray-agent-xray-bundle.tar.gz
          [[ -s "$bundle" ]] || { echo 'Rill bundle missing'; exit 1; }
          python3 - "$EXPECTED_CANONICAL_COMMIT" "$EXPECTED_CANONICAL_DIGEST" <<'PY'
          import hashlib, json, pathlib, subprocess, sys
          commit, digest = sys.argv[1:]
          pin=json.loads(pathlib.Path('repository_files/rill_integration/RILL_CANONICAL_PIN.json').read_text())
          manifest=json.loads(pathlib.Path('.canonical/integrations/xray_bash_onekey/CANONICAL_MANIFEST.json').read_text())
          bundle=hashlib.sha256(pathlib.Path('assets/rill-xray-agent-xray-bundle.tar.gz').read_bytes()).hexdigest()
          assert pin['canonicalCommit']==commit and pin['canonicalDigest']==digest
          assert subprocess.check_output(['git','-C','.canonical','rev-parse','HEAD'],text=True).strip()==commit
          assert manifest['canonicalDigest']==digest and manifest['bundleSha256']==bundle
          print(f"canonical_bundle_sha={bundle}")
          PY
          install_sha=$(sha256sum install.sh | awk '{print $1}')
          bundle_sha=$(sha256sum "$bundle" | awk '{print $1}')
          canonical_bundle_sha=$(python3 -c "import json; print(json.load(open('.canonical/integrations/xray_bash_onekey/CANONICAL_MANIFEST.json'))['bundleSha256'])")
          [[ "$bundle_sha" == "$canonical_bundle_sha" ]]
          {
            echo "version=$version"
            echo "install_sha=$install_sha"
            echo "bundle_sha=$bundle_sha"
            echo "candidate_commit=$candidate_commit"
            echo "canonical_commit=$EXPECTED_CANONICAL_COMMIT"
            echo "canonical_digest=$EXPECTED_CANONICAL_DIGEST"
            echo "canonical_bundle_sha=$canonical_bundle_sha"
          } >> "$GITHUB_OUTPUT"

  qualify:
    needs: candidate
    uses: ./.github/workflows/test-install.yml
    with:
      candidate_commit: ${{ needs.candidate.outputs.candidate_commit }}
      canonical_commit: ${{ needs.candidate.outputs.canonical_commit }}
      canonical_digest: ${{ needs.candidate.outputs.canonical_digest }}
      canonical_bundle_sha256: ${{ needs.candidate.outputs.canonical_bundle_sha }}
    permissions:
      contents: read

  release:
    needs:
      - candidate
      - qualify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
    steps:
      - name: Checkout the qualified candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.candidate.outputs.candidate_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Assert completed qualification outputs
        env:
          CANDIDATE_COMMIT: ${{ needs.candidate.outputs.candidate_commit }}
          QUALIFIED_COMMIT: ${{ needs.qualify.outputs.candidate_commit }}
          CANONICAL_COMMIT: ${{ needs.candidate.outputs.canonical_commit }}
          QUALIFIED_CANONICAL_COMMIT: ${{ needs.qualify.outputs.canonical_commit }}
          CANONICAL_DIGEST: ${{ needs.candidate.outputs.canonical_digest }}
          QUALIFIED_CANONICAL_DIGEST: ${{ needs.qualify.outputs.canonical_digest }}
          BUNDLE_SHA: ${{ needs.candidate.outputs.bundle_sha }}
          QUALIFIED_CANONICAL_BUNDLE_SHA: ${{ needs.qualify.outputs.canonical_bundle_sha256 }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_COMMIT" == "$QUALIFIED_COMMIT" ]]
          [[ "$CANONICAL_COMMIT" == "$QUALIFIED_CANONICAL_COMMIT" ]]
          [[ "$CANONICAL_DIGEST" == "$QUALIFIED_CANONICAL_DIGEST" ]]
          [[ "$BUNDLE_SHA" == "$QUALIFIED_CANONICAL_BUNDLE_SHA" ]]

      - name: Prepare immutable release evidence
        id: evidence
        env:
          VERSION: ${{ needs.candidate.outputs.version }}
          INSTALL_SHA: ${{ needs.candidate.outputs.install_sha }}
          BUNDLE_SHA: ${{ needs.candidate.outputs.bundle_sha }}
          CANDIDATE_COMMIT: ${{ needs.candidate.outputs.candidate_commit }}
          CANONICAL_COMMIT: ${{ needs.candidate.outputs.canonical_commit }}
          CANONICAL_DIGEST: ${{ needs.candidate.outputs.canonical_digest }}
          INPUT_DETAILS: ${{ inputs.details }}
        run: |
          set -euo pipefail
          tmp="$RUNNER_TEMP/xray-release-${GITHUB_RUN_ID}"
          mkdir -p "$tmp"
          cp install.sh assets/rill-xray-agent-xray-bundle.tar.gz "$tmp/"
          (cd "$tmp" && sha256sum install.sh rill-xray-agent-xray-bundle.tar.gz > SHA256SUMS)
          python3 - "$tmp/release-manifest.json" <<'PY'
          import json, os, sys
          doc={
            "schemaVersion":1,
            "version":os.environ["VERSION"],
            "candidateCommit":os.environ["CANDIDATE_COMMIT"],
            "installSha256":os.environ["INSTALL_SHA"],
            "bundleSha256":os.environ["BUNDLE_SHA"],
            "canonicalCommit":os.environ["CANONICAL_COMMIT"],
            "canonicalDigest":os.environ["CANONICAL_DIGEST"],
            "qualificationRunId":os.environ["GITHUB_RUN_ID"],
            "qualificationWorkflow":".github/workflows/test-install.yml",
          }
          with open(sys.argv[1],"w") as f: json.dump(doc,f,indent=2,sort_keys=True); f.write("\n")
          PY
          details=${INPUT_DETAILS:-release: publish Xray shell ${VERSION}}
          printf '%s' "$details" > "$tmp/details"
          echo "directory=$tmp" >> "$GITHUB_OUTPUT"

      - name: Create or verify immutable Release
        env:
          VERSION: ${{ needs.candidate.outputs.version }}
          INSTALL_SHA: ${{ needs.candidate.outputs.install_sha }}
          BUNDLE_SHA: ${{ needs.candidate.outputs.bundle_sha }}
          CANDIDATE_COMMIT: ${{ needs.candidate.outputs.candidate_commit }}
          CANONICAL_COMMIT: ${{ needs.candidate.outputs.canonical_commit }}
          CANONICAL_DIGEST: ${{ needs.candidate.outputs.canonical_digest }}
          SUMS_DIR: ${{ steps.evidence.outputs.directory }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          expected_manifest="$SUMS_DIR/release-manifest.json"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            meta=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease)
            [[ $(jq -r .tagName <<<"$meta") == "$tag" ]]
            [[ $(jq -r .isDraft <<<"$meta") == false ]]
            [[ $(jq -r .isPrerelease <<<"$meta") == false ]]
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
              --pattern install.sh --pattern rill-xray-agent-xray-bundle.tar.gz \
              --pattern SHA256SUMS --pattern release-manifest.json --dir "$SUMS_DIR/download"
            (cd "$SUMS_DIR/download" && sha256sum -c SHA256SUMS)
            [[ $(sha256sum "$SUMS_DIR/download/install.sh" | awk '{print $1}') == "$INSTALL_SHA" ]]
            [[ $(sha256sum "$SUMS_DIR/download/rill-xray-agent-xray-bundle.tar.gz" | awk '{print $1}') == "$BUNDLE_SHA" ]]
            existing="$SUMS_DIR/download/release-manifest.json"
            for pair in \
              "version:$VERSION" "candidateCommit:$CANDIDATE_COMMIT" \
              "installSha256:$INSTALL_SHA" "bundleSha256:$BUNDLE_SHA" \
              "canonicalCommit:$CANONICAL_COMMIT" "canonicalDigest:$CANONICAL_DIGEST"; do
              key=${pair%%:*}; value=${pair#*:}
              [[ $(jq -r --arg key "$key" '.[$key]' "$existing") == "$value" ]]
            done
            prior_run=$(jq -r '.qualificationRunId' "$existing")
            [[ "$prior_run" =~ ^[0-9]+$ ]]
            prior=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$prior_run")
            [[ $(jq -r .head_sha <<<"$prior") == "$CANDIDATE_COMMIT" ]]
            [[ $(jq -r .path <<<"$prior") == ".github/workflows/publish-shell-version.yml" ]]
            jobs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$prior_run/jobs")
            [[ $(jq '[.jobs[] | select(.name | endswith("release-candidate-gate")) | select(.conclusion == "success")] | length' <<<"$jobs") == 1 ]]
          else
            (cd "$SUMS_DIR" && sha256sum -c SHA256SUMS)
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$CANDIDATE_COMMIT" \
              --title "Xray ${VERSION}" --notes "${VERSION} Release" \
              "$SUMS_DIR/install.sh" "$SUMS_DIR/rill-xray-agent-xray-bundle.tar.gz" \
              "$SUMS_DIR/SHA256SUMS" "$expected_manifest"
          fi
          tag_ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.type + " " + .object.sha')
          tag_type=${tag_ref%% *}; tag_sha=${tag_ref#* }
          if [[ "$tag_type" == tag ]]; then tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha" --jq '.object.sha'); fi
          [[ "$tag_sha" == "$CANDIDATE_COMMIT" ]] || {
            echo "Release $tag points at $tag_sha, expected immutable candidate $CANDIDATE_COMMIT" >&2
            exit 1
          }

      - name: Checkout version API main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: hello-yunshu/Xray_bash_onekey_api
          ref: main
          path: api
          fetch-depth: 0
          token: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}

      - name: Prepare paired API metadata
        env:
          VERSION: ${{ needs.candidate.outputs.version }}
          INSTALL_SHA: ${{ needs.candidate.outputs.install_sha }}
          INPUT_DETAILS: ${{ inputs.details }}
        run: |
          set -euo pipefail
          details=${INPUT_DETAILS:-release: publish shell ${VERSION}}
          python3 scripts/release_automation.py update-api \
            --xray . --api api --details "$details" --shell-release-sha256 "$INSTALL_SHA"
          (cd api && bash validate-json.sh)

      - name: Publish API promotion after the immutable Release
        env:
          VERSION: ${{ needs.candidate.outputs.version }}
          X_ACCESS_TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
        run: |
          set -euo pipefail
          if git -C api diff --quiet; then
            echo 'API already contains the paired shell Release metadata'
            exit 0
          fi
          branch="automation/shell-${VERSION}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git -C api config user.name github-actions[bot]
          git -C api config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C api switch -c "$branch"
          git -C api add xray_shell_versions.json
          git -C api commit -m "chore(release): publish shell ${VERSION} Release metadata"
          git -C api push "https://x-access-token:${X_ACCESS_TOKEN}@github.com/hello-yunshu/Xray_bash_onekey_api.git" "HEAD:${branch}"
          pr=$(gh pr create --repo hello-yunshu/Xray_bash_onekey_api --base main --head "$branch" \
            --title "chore(release): publish shell ${VERSION}" \
            --body "Paired with Xray Release v${VERSION}; manifest records candidate SHA, canonical digest, asset hashes, and qualification run.")
          scripts/merge_checked_pr.sh hello-yunshu/Xray_bash_onekey_api "${pr##*/}"
          curl -fsS "https://purge.jsdelivr.net/gh/hello-yunshu/Xray_bash_onekey_api@main/xray_shell_versions.json" >/dev/null || true
