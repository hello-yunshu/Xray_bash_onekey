name: Sync Rill Canonical

on:
  workflow_dispatch:
  schedule:
    - cron: '41 * * * *'

concurrency:
  group: sync-rill-canonical
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout Xray main
        uses: actions/checkout@v5
        with:
          ref: main
          path: xray
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout Agent main
        uses: actions/checkout@v5
        with:
          repository: hello-yunshu/rill-xray-agent
          ref: main
          path: rill
          fetch-depth: 0
          persist-credentials: false

      - name: Verify Xray Host Contract source bytes
        run: |
          set -euo pipefail
          python3 xray/scripts/verify_rill_host_contract.py \
            --repo xray \
            --contract xray/repository_files/rill_integration/HOST_CONTRACT.json

      - name: Compare canonical digests
        id: drift
        run: |
          set -euo pipefail
          python3 xray/scripts/release_automation.py check-rill-drift \
            --xray xray --rill rill --github-output "${GITHUB_OUTPUT}"

      - name: Install Agent gate dependencies
        if: steps.drift.outputs.changed == 'true'
        run: |
          set -euo pipefail
          python3 -m pip install jsonschema
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Validate active Agent canonical output
        if: steps.drift.outputs.changed == 'true'
        run: |
          set -euo pipefail
          (cd rill && python3 scripts/run_all_checks.py)
          (cd rill && python3 scripts/verify_xray_upstream_anchor.py)
          shellcheck --exclude=SC1091 rill/integrations/xray_bash_onekey/repository_files/scripts/*.sh
          git -C rill diff --check

      - name: Apply active canonical output to Xray worktree
        if: steps.drift.outputs.changed == 'true'
        run: |
          set -euo pipefail
          python3 xray/scripts/release_automation.py apply-rill \
            --xray xray \
            --rill rill \
            --commit "$(git -C rill rev-parse HEAD)" \
            --digest "${{ steps.drift.outputs.current_canonical_digest }}"
          python3 xray/scripts/release_automation.py stage-rill --xray xray --rill rill
          git -C xray diff --check
          allowed='^((rill_payload/)|(scripts/rill_xray_agent_)|(systemd/rill-xray-agent-)|(assets/rill-xray-agent-xray-bundle\.tar\.gz)|repository_files/rill_integration/RILL_CANONICAL_PIN\.json)'
          unexpected=$(git -C xray diff --cached --name-only | while IFS= read -r path; do [[ "$path" =~ $allowed ]] || echo "$path"; done)
          [[ -z "$unexpected" ]] || { echo "unexpected files in automated Xray sync:" >&2; echo "$unexpected" >&2; exit 1; }

      - name: Create or update Xray canonical PR
        if: steps.drift.outputs.changed == 'true'
        working-directory: xray
        env:
          XRAY_REPO: hello-yunshu/Xray_bash_onekey
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          branch="automation/sync-rill-canonical-${{ steps.drift.outputs.current_canonical_digest }}"
          git switch -c "$branch"
          git commit -m "chore(rill): sync canonical ${{ steps.drift.outputs.current_canonical_digest }}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${XRAY_REPO}.git" "HEAD:${branch}"
          pr_url=$(gh pr list --repo "${XRAY_REPO}" --head "${branch}" --json url --jq '.[0].url')
          if [[ -z "$pr_url" ]]; then
            pr_url=$(gh pr create --repo "${XRAY_REPO}" --base main --head "${branch}" \
              --title "chore(rill): sync canonical ${{ steps.drift.outputs.current_canonical_digest }}" \
              --body "Automated one-way canonical convergence.\n\nold canonical digest: ${{ steps.drift.outputs.pinned_canonical_digest }}\nnew canonical digest: ${{ steps.drift.outputs.current_canonical_digest }}\nAgent commit: $(git -C ../rill rev-parse HEAD)\n\nValidation: Host Contract source-byte verification, Agent Source Gates, remote consumer checks, deterministic payload manifest verification, and deletion-aware staging.")
          fi
          echo "PR: ${pr_url}"
          if ! gh pr merge "${pr_url##*/}" --repo "${XRAY_REPO}" --auto --squash; then
            echo "AWAITING_MERGE_POLICY"
          fi

      - name: Report stable state
        if: steps.drift.outputs.changed == 'false'
        run: echo 'NO_CHANGE'
