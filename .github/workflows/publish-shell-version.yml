name: Release Xray

on:
  workflow_dispatch:
    inputs:
      details:
        description: Release summary
        required: false
        type: string

concurrency:
  group: release-xray
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
    steps:
      - name: Checkout Xray main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Validate release candidate
        id: candidate
        env:
          INPUT_DETAILS: ${{ inputs.details }}
        run: |
          set -euo pipefail
          bash -n install.sh
          bash -n scripts/*.sh
          python3 .github/test/test_release_automation.py
          version=$(sed -n 's/^shell_version="\([0-9][0-9.]*\)"$/\1/p' install.sh)
          [[ -n "$version" ]] || { echo 'shell_version missing'; exit 1; }
          bundle=assets/rill-xray-agent-xray-bundle.tar.gz
          [[ -s "$bundle" ]] || { echo 'Rill bundle missing'; exit 1; }
          tmp=$(mktemp -d)
          (cd "$(dirname install.sh)" && sha256sum "$(basename install.sh)") > "$tmp/SHA256SUMS"
          (cd "$(dirname "$bundle")" && sha256sum "$(basename "$bundle")") >> "$tmp/SHA256SUMS"
          install_sha=$(awk '$2 == "install.sh" {print $1}' "$tmp/SHA256SUMS")
          bundle_sha=$(awk '$2 == "rill-xray-agent-xray-bundle.tar.gz" {print $1}' "$tmp/SHA256SUMS")
          {
            echo "version=$version"
            echo "install_sha=$install_sha"
            echo "bundle_sha=$bundle_sha"
            echo "candidate_commit=$(git rev-parse HEAD)"
            echo "sums=$tmp/SHA256SUMS"
          } >> "$GITHUB_OUTPUT"
          details=${INPUT_DETAILS:-release: publish Xray shell ${version}}
          printf '%s' "$details" > "$tmp/details"

      - name: Create or verify immutable Release
        env:
          VERSION: ${{ steps.candidate.outputs.version }}
          INSTALL_SHA: ${{ steps.candidate.outputs.install_sha }}
          BUNDLE_SHA: ${{ steps.candidate.outputs.bundle_sha }}
          CANDIDATE_COMMIT: ${{ steps.candidate.outputs.candidate_commit }}
          SUMS: ${{ steps.candidate.outputs.sums }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          tmp=$(dirname "$SUMS")
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            meta=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease)
            [[ $(jq -r .tagName <<<"$meta") == "$tag" ]] || exit 1
            [[ $(jq -r .isDraft <<<"$meta") == false ]] || exit 1
            [[ $(jq -r .isPrerelease <<<"$meta") == false ]] || exit 1
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern install.sh --pattern rill-xray-agent-xray-bundle.tar.gz --pattern SHA256SUMS --dir "$tmp/download"
            (cd "$tmp/download" && sha256sum -c SHA256SUMS)
            [[ $(sha256sum "$tmp/download/install.sh" | awk '{print $1}') == "$INSTALL_SHA" ]] || exit 1
            [[ $(sha256sum "$tmp/download/rill-xray-agent-xray-bundle.tar.gz" | awk '{print $1}') == "$BUNDLE_SHA" ]] || {
              echo "existing Release $tag has a different Rill bundle; bump shell_version" >&2
              exit 1
            }
            tag_ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.type + " " + .object.sha')
            tag_type=${tag_ref%% *}
            tag_sha=${tag_ref#* }
            if [[ "$tag_type" == tag ]]; then
              tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha" --jq '.object.sha')
            fi
            [[ "$tag_sha" == "$CANDIDATE_COMMIT" ]] || {
              echo "existing Release $tag points at $tag_sha, expected immutable candidate $CANDIDATE_COMMIT" >&2
              exit 1
            }
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target main \
              --title "Xray ${VERSION}" --notes "${VERSION} Release" \
              install.sh assets/rill-xray-agent-xray-bundle.tar.gz "$SUMS"
          fi
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease,assets

      - name: Checkout version API main
        uses: actions/checkout@v5
        with:
          repository: hello-yunshu/Xray_bash_onekey_api
          ref: main
          path: api
          fetch-depth: 0
          token: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}

      - name: Prepare paired API metadata
        env:
          VERSION: ${{ steps.candidate.outputs.version }}
          INSTALL_SHA: ${{ steps.candidate.outputs.install_sha }}
          INPUT_DETAILS: ${{ inputs.details }}
        run: |
          set -euo pipefail
          details=${INPUT_DETAILS:-release: publish Xray shell ${VERSION}}
          python3 scripts/release_automation.py update-api \
            --xray . --api api --details "$details" --shell-release-sha256 "$INSTALL_SHA"
          (cd api && bash validate-json.sh)

      - name: Publish and merge API metadata
        env:
          VERSION: ${{ steps.candidate.outputs.version }}
          X_ACCESS_TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
        run: |
          set -euo pipefail
          if git -C api diff --quiet; then
            echo 'API already contains the paired shell Release metadata'
            exit 0
          fi
          branch="automation/shell-${VERSION}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git -C api config user.name github-actions[bot]
          git -C api config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C api switch -c "$branch"
          git -C api add xray_shell_versions.json
          git -C api commit -m "chore(release): publish shell ${VERSION} Release metadata"
          git -C api push "https://x-access-token:${X_ACCESS_TOKEN}@github.com/hello-yunshu/Xray_bash_onekey_api.git" "HEAD:${branch}"
          pr=$(gh pr create --repo hello-yunshu/Xray_bash_onekey_api --base main --head "$branch" \
            --title "chore(release): publish shell ${VERSION}" \
            --body "Paired with Xray Release v${VERSION}; install.sh SHA256 is recorded in the manifest.")
          scripts/merge_checked_pr.sh hello-yunshu/Xray_bash_onekey_api "${pr##*/}"
          curl -fsS "https://purge.jsdelivr.net/gh/hello-yunshu/Xray_bash_onekey_api@main/xray_shell_versions.json" >/dev/null || true
