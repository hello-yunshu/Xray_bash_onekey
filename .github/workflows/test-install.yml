name: Test Install

on:
  workflow_call:
    inputs:
      candidate_commit:
        required: true
        type: string
      canonical_commit:
        required: true
        type: string
      canonical_digest:
        required: true
        type: string
      canonical_bundle_sha256:
        required: true
        type: string
    outputs:
      candidate_commit:
        value: ${{ jobs.release-candidate-gate.outputs.candidate_commit }}
      canonical_commit:
        value: ${{ jobs.release-candidate-gate.outputs.canonical_commit }}
      canonical_digest:
        value: ${{ jobs.release-candidate-gate.outputs.canonical_digest }}
      canonical_bundle_sha256:
        value: ${{ jobs.release-candidate-gate.outputs.canonical_bundle_sha256 }}
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      api_ref:
        description: 'API repo ref (branch/tag/sha)'
        required: false
        default: 'main'
      nginx_ref:
        description: 'Nginx repo ref (branch/tag/sha)'
        required: false
        default: 'main'
      skill_ref:
        description: 'Skill repo ref (branch/tag/sha)'
        required: false
        default: 'main'

concurrency:
  # A main push also starts Release Xray, which calls this workflow. Keep
  # those runs separate so installation CI cannot cancel release qualification.
  group: test-install-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.candidate_commit || github.sha }}
          persist-credentials: false
          # The legacy auto_update fixture reads the v3.2.11 tag.
          fetch-depth: 0

      - name: Ensure external checkout helper
        run: |
          set -euo pipefail
          if [[ ! -f scripts/checkout_external_repo.sh ]]; then
            mkdir -p scripts
            git fetch --quiet --depth=1 origin main
            git show FETCH_HEAD:scripts/checkout_external_repo.sh > scripts/checkout_external_repo.sh
            chmod +x scripts/checkout_external_repo.sh
          fi

      - name: Checkout external repo (retry)
        env:
          GH_TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN || github.token }}
        run: scripts/checkout_external_repo.sh "hello-yunshu/Xray_bash_onekey_api" "${{ inputs.api_ref || 'main' }}" ".phase1-contracts/api"

      - name: Checkout external repo (retry)
        env:
          GH_TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN || github.token }}
        run: scripts/checkout_external_repo.sh "hello-yunshu/Xray_bash_onekey_Nginx" "${{ inputs.nginx_ref || 'main' }}" ".phase1-contracts/nginx"

      - name: Run Phase 1 regression tests
        run: |
          set -euo pipefail
          bash .github/test/test_redact.sh
          bash .github/test/test_fail2ban.sh
          bash .github/test/test_nginx_tar_security.sh
          bash .github/test/test_nginx_update_rollback.sh
          bash .github/test/test_phase1_safety.sh
          # Bootstrap dependency / error-propagation regression (13.2-13.4, 13.10):
          # pkg_install multi-package failure propagation, offline/online language
          # init ordering, lazy config load, candidate-guard stage diagnostics.
          bash .github/test/test_bootstrap_dependencies.sh
          bash .github/test/test_log_rotation.sh
          # Issue #102: metadata must be loaded before the first immutable
          # candidate URL is constructed; this is separate from the full
          # zero-state user journey below.
          bash .github/test/test_shell_bootstrap_ordering.sh
          # Xray update transaction tests (auto + manual mode coverage)
          bash .github/test/test_xray_update_transaction.sh
          bash .github/test/test_shell_update_confirmation.sh
          bash .github/test/test_backup_permissions.sh
          # User-facing --backup/restore: content completeness, timestamp
          # selection, corrupt/truncated archive rejection, version reporting.
          # Immutable release candidates published before this test existed
          # cannot contain it; log the exception instead of failing the legacy
          # re-verification. Every new candidate from main runs it.
          if [[ -f .github/test/test_backup_restore.sh ]]; then
            bash .github/test/test_backup_restore.sh
            # Legacy archives without the managed asset symlink must self-heal
            # on restore; layout/rollback assertions run here, the real-Xray
            # read-through probe runs in stats-readout-matrix.
            bash .github/test/test_restore_geodata_selfheal.sh
            # Traffic stats: api/stats/policy merge is idempotent, the
            # downloaded status_config merge source is removed, and
            # enable->disable->enable converges byte-for-byte.
            bash .github/test/test_xray_stats.sh
          else
            echo "legacy candidate predates test_backup_restore.sh; skipped only for immutable re-verification"
          fi
          bash .github/test/test_log_privacy.sh
          bash .github/test/test_install_uninstall_transaction.sh
          bash .github/test/test_legacy_auto_update_path.sh
          bash .github/test/test_xray_version_pipefail.sh
          bash .github/test/test_xray_installer_metadata.sh
          # Xray config/log ownership must follow the systemd unit account
          # (Xray-install switched User=nobody -> User=xray).
          bash .github/test/test_xray_service_user_permissions.sh
          # Stage 01: certificate renewal must never leave a running Nginx down,
          # Xray logs must not be world-readable, and new ws/gRPC/xHTTP ONLY
          # backends must not bind 0.0.0.0 by default.
          bash .github/test/test_ssl_update_recovery.sh
          bash .github/test/test_cert_update_recovery.sh
          bash .github/test/test_ws_only_listen_address.sh
          # Stage 02: the XTLS ONLY profile is gone (Vision/Reality untouched)
          # and the independent relay role only ever writes a managed Nginx
          # Stream fragment, with rollback and role persistence.
          bash .github/test/test_relay_node.sh
          # Stage 03: normal nodes get Xray's native geodata schedule (no
          # external cron, no restart), scoped asset permissions, and an
          # honest status view instead of the legacy geo_version.json.
          bash .github/test/test_geodata_native.sh
          # Stage 05: `-u` must not migrate in the same run; the next startup
          # hook and the GeoData menu are the two migration entry points.
          bash .github/test/test_geodata_update_path.sh
          # ANSI output: color variables must be real ESC bytes, non-TTY logs
          # must stay control-byte free, and a PTY must still render colors.
          python3 .github/test/test_color_output.py
          # Stage 04: auto-update retries are keyed on the failed target
          # version (legacy .xray/.nginx markers no longer block forever),
          # metadata falls back to GitHub Raw, and relay nodes never treat a
          # missing Xray as a failure.
          bash .github/test/test_auto_update_failure_records.sh
          # Stage 04: Xray 26.7.11 made an unset REALITY minClientVer reject
          # older clients; the installer/template now write it explicitly and
          # repair existing configs without touching a user-chosen value.
          bash .github/test/test_reality_min_client_ver.sh
          # Stage 04: "different" is not "newer". A regressed metadata target
          # must never reinstall an older Xray/Nginx over a working host.
          bash .github/test/test_version_downgrade_guard.sh
          # The release workflow tags whatever install.sh declares; CHANGELOG
          # must have the matching entry. README is product documentation, not
          # release history, and must not narrate a shell version.
          bash .github/test/test_shell_version_consistency.sh
          bash -n .github/test/test_installer_candidate_smoke.sh
          bash .github/test/test_vps_auto_update_schedule.sh
          # Online version metadata must fall back cleanly without contaminating values.
          bash .github/test/test_version_loading.sh
          # Install wizard profile tests (hierarchical menu profiles)
          bash .github/test/test_install_menu_profiles.sh
          # Reinstall config preservation tests (8 scenarios: backup/restore/merge)
          bash .github/test/test_reinstall_preservation.sh
          # Reinstall call-chain RETURN trap tests (real install chain coverage)
          bash .github/test/test_reinstall_call_chain.sh
          sudo bash .github/test/test_nginx_security.sh
          # Production Nginx health default path (P0-3)
          bash .github/test/test_nginx_health_production_defaults.sh
          # Reality+Nginx user-feedback regressions: serverNames single-hostname
          # validation, stale/corrupt *.serverNames self-heal on reinstall,
          # and Reality privateKey not printed to terminal.
          bash .github/test/test_reality_nginx_feedback.sh
          # Cross-repository release automation must remain deterministic and
          # must never overwrite manually promoted tested-version metadata.
          python3 .github/test/test_release_automation.py
          python3 .github/test/test_convergence.py
          bash -n scripts/merge_checked_pr.sh

      - name: Install PyYAML for Clash parser test
        run: |
          # The Clash parser test must genuinely execute in CI (spec 5.1).
          # Prefer pip; fall back to apt if pip is unavailable.
          python3 -m pip install --quiet --user pyyaml \
            || { sudo apt-get update -qq && sudo apt-get install -y -qq python3-yaml; }

      - name: Run user-safety regression tests
        run: |
          set -euo pipefail
          bash .github/test/test_port_safety.sh
          bash .github/test/test_offline_commands.sh
          bash .github/test/test_input_eof.sh
          bash .github/test/test_port_validation.sh
          bash .github/test/test_firewall_reconcile.sh
          # IPv6-aware managed firewall (dual-stack mirroring + rollback)
          bash .github/test/test_firewall_ipv6.sh
          # Firewall cross-network-family transitions (dual->ipv4 cleanup,
          # ipv4/ipv6->dual, port+family change, family-aware rollback and
          # persistence, missing-ip6tables fail-closed). All mocked.
          bash .github/test/test_firewall_family_transition.sh
          # End-to-end firewall transaction tests: successful mode switch
          # (baseline + managed ports + persistence), failed deploy rollback
          # persistence (reboot-safe), partial baseline rollback, and user
          # custom-rule protection. All mocked.
          bash .github/test/test_firewall_transaction_complete.sh
          bash .github/test/test_shell_update_metadata.sh
          bash .github/test/test_release_reconciliation.sh
          # Fresh-process dual-stack runtime hydration (restart keeps IPv4/IPv6
          # Reality/XTLS/None share links) — mandatory, not optional
          bash .github/test/test_dual_stack_runtime.sh
          # IPv4/IPv6 dual-stack support regression tests (literal detection,
          # URI authority bracket, network capability, A/AAAA qualification,
          # bad-record gating, old-config compat, dual direct-IP links)
          bash .github/test/test_dual_stack.sh
          # DNS multi-record aggregation + dedup over the IPv4-resolver A/AAAA path
          bash .github/test/test_dns_multi_record.sh
          # Clash YAML parser-level validation for dual-stack direct-IP output
          bash .github/test/test_clash_yaml.sh
          # Optional real IPv6 socket smoke test (SKIPs cleanly when the runner
          # has no IPv6 socket capability; never counted as PASS)
          bash .github/test/test_ipv6_smoke.sh

  rill-qualification:
    # Rill, RillML, and Skill remain strict qualification surfaces, but are
    # deliberately outside the Core release-gate dependency chain.
    # Kept separate from .github/workflows/rill-xray-agent.yml: the standalone
    # workflow verifies the pinned Agent/canonical payload on Rill paths, while
    # this job adds the cross-repo API/Nginx/Skill contract and install checks
    # required by release-candidate-gate. Overlap is limited to Rill paths.
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.candidate_commit || github.sha }}
          persist-credentials: false
      - name: Ensure external checkout helper
        run: |
          set -euo pipefail
          if [[ ! -f scripts/checkout_external_repo.sh ]]; then
            mkdir -p scripts
            git fetch --quiet --depth=1 origin main
            git show FETCH_HEAD:scripts/checkout_external_repo.sh > scripts/checkout_external_repo.sh
            chmod +x scripts/checkout_external_repo.sh
          fi
      - name: Checkout external repo (retry)
        env:
          GH_TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN || github.token }}
        run: scripts/checkout_external_repo.sh "hello-yunshu/Xray_bash_onekey_api" "${{ inputs.api_ref || 'main' }}" ".phase1-contracts/api"
      - name: Checkout external repo (retry)
        env:
          GH_TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN || github.token }}
        run: scripts/checkout_external_repo.sh "hello-yunshu/Xray_bash_onekey_Nginx" "${{ inputs.nginx_ref || 'main' }}" ".phase1-contracts/nginx"
      - name: Checkout external repo (retry)
        env:
          GH_TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN || github.token }}
        run: scripts/checkout_external_repo.sh "hello-yunshu/Xray_bash_onekey_skill" "${{ inputs.skill_ref || 'main' }}" ".phase1-contracts/skill"
      - name: Run Rill qualification
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN_REPO_ROOT: ${{ github.workspace }}
          SKILL_REPO: ${{ github.workspace }}/.phase1-contracts/skill
        run: |
          set -euo pipefail
          bash .github/test/test_cross_repo_contract.sh .phase1-contracts/api .phase1-contracts/nginx .phase1-contracts/skill
          bash .github/test/test_rill_xray_agent.sh
          bash .github/test/test_rill_xray_agent_operational_intelligence.sh
          bash .github/test/test_rill_xray_agent_verify_modes.sh
          bash .github/test/test_install_uninstall_transaction.sh
          bash .github/test/test_candidate_self_check.sh
          sudo bash .github/test/test_rill_xray_agent_rillml.sh
          bash .phase1-contracts/skill/tests/test_contract.sh
          bash .phase1-contracts/skill/tests/test_contract_exec.sh
          bash .phase1-contracts/skill/tests/test_full_flow_noninteractive.sh

  test-install:
    # T5: qualification jobs are parallel and independent. Never gate the
    # install-mode matrix on security-regression: a red unit job must not
    # silently skip the real install qualification (and then "pass" release-gate
    # via skipped). Each mode runs regardless of the other jobs' outcome.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode:
          # relay replaces the removed XTLS ONLY profile: an independent Nginx
          # Stream TCP relay that never installs Xray.
          - relay
          - ws_grpc_xhttp
          - reality
          - reality_nginx
          - tls

    name: Install (${{ matrix.mode }})

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.candidate_commit || github.sha }}
          persist-credentials: false

      - name: Ensure external checkout helper
        run: |
          set -euo pipefail
          if [[ ! -f scripts/checkout_external_repo.sh ]]; then
            mkdir -p scripts
            git fetch --quiet --depth=1 origin main
            git show FETCH_HEAD:scripts/checkout_external_repo.sh > scripts/checkout_external_repo.sh
            chmod +x scripts/checkout_external_repo.sh
          fi

      - name: Checkout external repo (retry)
        env:
          GH_TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN || github.token }}
        run: scripts/checkout_external_repo.sh "hello-yunshu/Xray_bash_onekey_api" "${{ inputs.api_ref || 'main' }}" ".phase1-contracts/api"

      - name: Run redaction unit tests
        run: bash .github/test/test_redact.sh

      - name: Run install test (${{ matrix.mode }})
        timeout-minutes: 15
        env:
          XRAY_VERSIONS_FILE: ${{ github.workspace }}/.phase1-contracts/api/xray_shell_versions.json
        run: sudo -E bash .github/test/test_install.sh ${{ matrix.mode }}

      - name: Verify real Xray access after fresh and legacy permission migration
        if: matrix.mode != 'relay'
        run: sudo bash .github/test/test_xray_runtime_permissions.sh

      - name: Upgrade legacy service accounts with the pinned official installer
        if: matrix.mode != 'relay'
        timeout-minutes: 10
        env:
          XRAY_VERSIONS_FILE: ${{ github.workspace }}/.phase1-contracts/api/xray_shell_versions.json
        run: sudo -E bash .github/test/test_xray_legacy_service_upgrade.sh

      - name: Verify offline purge removes the host surface
        timeout-minutes: 10
        run: sudo bash .github/test/test_uninstall_clean.sh

      - name: Collect debug info on failure (redacted)
        if: failure()
        run: |
          # Source unified redaction helpers (no secrets in CI output)
          source .github/test/redact.sh
          echo "=== Install config (summary, no secrets) ==="
          sudo bash -c 'source .github/test/redact.sh; safe_print_config_summary "$1"' \
            _ /etc/idleleo/conf/install_config.json 2>/dev/null || echo "(not found)"
          echo ""
          echo "=== Xray config (redacted) ==="
          sudo bash -c 'source .github/test/redact.sh; redact_json_for_diagnostics "$1"' \
            _ /etc/idleleo/conf/xray/config.json 2>/dev/null || echo "(not found)"
          echo ""
          echo "=== Install config (redacted) ==="
          sudo bash -c 'source .github/test/redact.sh; redact_json_for_diagnostics "$1"' \
            _ /etc/idleleo/conf/install_config.json 2>/dev/null || echo "(not found)"
          echo ""
          echo "=== Xray service status ==="
          sudo systemctl status xray 2>&1 | redact_text_for_diagnostics /dev/stdin || true
          echo ""
          echo "=== Xray error log (redacted) ==="
          sudo tail -50 /var/log/xray/error.log 2>/dev/null | redact_text_for_diagnostics /dev/stdin || echo "(not found)"
          echo ""
          echo "=== Nginx service status ==="
          sudo systemctl status nginx 2>&1 | redact_text_for_diagnostics /dev/stdin || true
          echo ""
          echo "=== Nginx error log (redacted) ==="
          sudo tail -50 /usr/local/nginx/logs/error.log 2>/dev/null | redact_text_for_diagnostics /dev/stdin || echo "(not found)"
          echo ""
          echo "=== Install log (redacted) ==="
          sudo tail -100 /etc/idleleo/logs/install.log 2>/dev/null | redact_text_for_diagnostics /dev/stdin || echo "(not found)"

  relay-guards:
    # The relay role must never coexist with a node install, and a legacy
    # XTLS ONLY host must never be silently reinstalled. Both guards are cheap
    # (no Nginx download) and run separately from the install matrix so a guard
    # regression is not buried in a 15-minute install log.
    runs-on: ubuntu-latest
    timeout-minutes: 10

    name: Relay mixing and legacy-mode guards

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.candidate_commit || github.sha }}
          persist-credentials: false

      - name: Ensure external checkout helper
        run: |
          set -euo pipefail
          if [[ ! -f scripts/checkout_external_repo.sh ]]; then
            mkdir -p scripts
            git fetch --quiet --depth=1 origin main
            git show FETCH_HEAD:scripts/checkout_external_repo.sh > scripts/checkout_external_repo.sh
            chmod +x scripts/checkout_external_repo.sh
          fi

      - name: Checkout external repo (retry)
        env:
          GH_TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN || github.token }}
        run: scripts/checkout_external_repo.sh "hello-yunshu/Xray_bash_onekey_api" "${{ inputs.api_ref || 'main' }}" ".phase1-contracts/api"

      - name: Install runtime dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq curl qrencode iproute2 netcat-openbsd openssl socat

      - name: Verify relay mixing and legacy-mode guards
        timeout-minutes: 8
        env:
          XRAY_VERSIONS_FILE: ${{ github.workspace }}/.phase1-contracts/api/xray_shell_versions.json
        run: sudo -E bash .github/test/test_relay_container.sh guard

  minimal-bootstrap:
    # T5: independent of security-regression so a red unit job cannot skip the
    # minimal Docker qualification (Debian 12/13, Ubuntu 24.04, CentOS Stream
    # 10). Each matrix entry is a required release-gate input.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # The confirmed Bootstrap dependency closure must be proven on truly
        # minimal images that start with python3/jq/bc often absent, not on an
        # ubuntu-latest runner that already carries most tooling. CentOS
        # Stream 10 additionally proves the RPM-family manager selection (dnf
        # over the yum alias) and that package query/install/refresh all route
        # through the selected manager, never a hard-coded alias.
        image:
          - debian:12-slim
          - debian:13-slim
          - ubuntu:24.04
          - ubuntu:26.04
          - quay.io/centos/centos:stream10

    name: Minimal Bootstrap (${{ matrix.image }})

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.candidate_commit || github.sha }}
          persist-credentials: false

      - name: Run minimal bootstrap test in container
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD":/repo:ro \
            -e REPO_DIR=/repo \
            "${{ matrix.image }}" \
            bash /repo/.github/test/test_minimal_bootstrap.sh

  stats-readout-matrix:
    # Real-Xray readout matrix for the three supported distros. The Xray
    # binary is downloaded on the runner and mounted read-only; each minimal
    # image installs only jq/curl, so the test does not depend on host tooling.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image:
          - debian:12-slim
          - ubuntu:24.04
          - quay.io/centos/centos:stream10
    name: Stats Readout (${{ matrix.image }})

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.candidate_commit || github.sha }}
          persist-credentials: false

      - name: Download real Xray for the matrix
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 \
            https://github.com/XTLS/Xray-core/releases/download/v26.10.31/Xray-linux-64.zip \
            -o /tmp/xray.zip
          mkdir -p /tmp/xray-bin
          unzip -q /tmp/xray.zip -d /tmp/xray-bin
          chmod +x /tmp/xray-bin/xray

      - name: Run stats tests in ${{ matrix.image }}
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD":/repo:ro \
            -v /tmp/xray-bin/xray:/usr/local/bin/xray:ro \
            "${{ matrix.image }}" \
            bash -lc '
              set -euo pipefail
              if command -v apt-get >/dev/null 2>&1; then
                apt-get update -qq
                apt-get install -y -qq jq curl diffutils
              else
                dnf install -y -q jq curl diffutils
              fi
              bash /repo/.github/test/test_xray_stats.sh
              XRAY_BIN=/usr/local/bin/xray bash /repo/.github/test/test_xray_stats_readout.sh
              XRAY_BIN=/usr/local/bin/xray bash /repo/.github/test/test_restore_geodata_selfheal.sh
            '

  true-fresh-install:
    # Core availability gate for Issue #102. This is deliberately separate
    # from the five-mode matrix: the matrix proves protocol/config breadth,
    # while this job proves the first user command through Xray health.
    # GitHub-hosted runner catalog currently exposes Ubuntu 24.04; the
    # minimal-bootstrap matrix separately covers Debian 13 and Ubuntu 26.04
    # image dependency closure.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    name: True Fresh Install (Ubuntu 24.04)

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.candidate_commit || github.sha }}
          persist-credentials: false

      - name: Ensure external checkout helper
        run: |
          set -euo pipefail
          if [[ ! -f scripts/checkout_external_repo.sh ]]; then
            mkdir -p scripts
            git fetch --quiet --depth=1 origin main
            git show FETCH_HEAD:scripts/checkout_external_repo.sh > scripts/checkout_external_repo.sh
            chmod +x scripts/checkout_external_repo.sh
          fi

      - name: Checkout external repo (retry)
        env:
          GH_TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN || github.token }}
        run: scripts/checkout_external_repo.sh "hello-yunshu/Xray_bash_onekey_api" "${{ inputs.api_ref || 'main' }}" ".phase1-contracts/api"

      - name: Run true fresh install through Xray health
        env:
          API_REPO_DIR: ${{ github.workspace }}/.phase1-contracts/api
          E2E_ARTIFACT_DIR: ${{ runner.temp }}/xray-true-fresh-artifacts
        run: sudo -E bash .github/test/test_true_fresh_install.sh

      - name: Scan true-fresh diagnostics for secrets
        id: artifact-scan
        if: always()
        run: |
          set -euo pipefail
          source .github/test/redact.sh
          scan_diagnostics_artifact_for_secrets "${{ runner.temp }}/xray-true-fresh-artifacts"

      - name: Upload redacted true-fresh diagnostics
        if: always() && steps.artifact-scan.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xray-true-fresh-diagnostics
          path: ${{ runner.temp }}/xray-true-fresh-artifacts
          if-no-files-found: ignore

  true-fresh-modes:
    # M6: every install mode starts from a clean runner, not only the reality
    # top-level journey. This matrix intentionally mirrors test-install so a
    # mode-specific regression cannot be hidden behind the main matrix.
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        mode:
          - relay
          - ws_grpc_xhttp
          - reality
          - reality_nginx
          - tls
    name: True Fresh Mode (${{ matrix.mode }})
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.candidate_commit || github.sha }}
          persist-credentials: false
      - name: Ensure external checkout helper
        run: |
          set -euo pipefail
          if [[ ! -f scripts/checkout_external_repo.sh ]]; then
            mkdir -p scripts
            git fetch --quiet --depth=1 origin main
            git show FETCH_HEAD:scripts/checkout_external_repo.sh > scripts/checkout_external_repo.sh
            chmod +x scripts/checkout_external_repo.sh
          fi
      - name: Checkout external repo (retry)
        env:
          GH_TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN || github.token }}
        run: scripts/checkout_external_repo.sh "hello-yunshu/Xray_bash_onekey_api" "${{ inputs.api_ref || 'main' }}" ".phase1-contracts/api"
      - name: Run fresh mode
        env:
          XRAY_VERSIONS_FILE: ${{ github.workspace }}/.phase1-contracts/api/xray_shell_versions.json
        run: sudo -E bash .github/test/test_install.sh ${{ matrix.mode }}

      # A missing binary/unit is exactly the interrupted-uninstall state. Purge
      # must still remove units and managed config, return 0, and stay quiet.
      - name: Verify purge after a simulated interrupted uninstall
        timeout-minutes: 10
        env:
          PURGE_DROP_BINARY: "1"
          PURGE_CORRUPT_CONFIG: "1"
        run: sudo -E bash .github/test/test_uninstall_clean.sh

  release-gate:
    # T5: single, independent gate. `if: always()` ensures every qualification
    # job's result is evaluated even when some of them fail; the step below
    # then fails the gate unless EVERY required job is `success`. `skipped` is
    # NOT accepted (a red unit job must not let skipped Docker/install
    # qualification pass as success).
    needs:
      - security-regression
      - test-install
      - relay-guards
      - minimal-bootstrap
      - true-fresh-install
      - true-fresh-modes
    runs-on: ubuntu-latest
    if: always()
    steps:
      - run: |
          echo "release-gate: all qualification jobs evaluated"
          echo "security-regression: ${{ needs.security-regression.result }}"
          echo "test-install matrix: ${{ needs.test-install.result }}"
          echo "minimal-bootstrap matrix: ${{ needs.minimal-bootstrap.result }}"
          echo "true-fresh-install: ${{ needs.true-fresh-install.result }}"
          echo "true-fresh-modes matrix: ${{ needs.true-fresh-modes.result }}"
          for job in ${{ join(needs.*.result, ' ') }}; do
            if [ "$job" != "success" ]; then
              echo "release-gate FAIL: required job result '$job' (only success qualifies)" >&2
              exit 1
            fi
          done
          echo "release-gate PASS"

  # Known coverage gap: on push/PR runs `inputs.candidate_commit` is empty, so
  # this job is skipped by design. It only runs when a release workflow passes a
  # candidate commit. `release-gate` intentionally does not list this job in its
  # `needs` and treats `skipped` as failure for every required job; do not add
  # this job to that gate just to make runs green.
  release-candidate-gate:
    if: always() && inputs.candidate_commit != ''
    needs:
      - security-regression
      - rill-qualification
      - test-install
      - relay-guards
      - minimal-bootstrap
      - true-fresh-install
      - true-fresh-modes
      - release-gate
    runs-on: ubuntu-latest
    timeout-minutes: 50
    outputs:
      candidate_commit: ${{ steps.subject.outputs.candidate_commit }}
      canonical_commit: ${{ steps.subject.outputs.canonical_commit }}
      canonical_digest: ${{ steps.subject.outputs.canonical_digest }}
      canonical_bundle_sha256: ${{ steps.subject.outputs.canonical_bundle_sha256 }}
    steps:
      - name: Assert every required qualification job succeeded
        run: |
          set -euo pipefail
          for result in \
            "${{ needs.security-regression.result }}" \
            "${{ needs.rill-qualification.result }}" \
            "${{ needs.test-install.result }}" \
            "${{ needs.relay-guards.result }}" \
            "${{ needs.minimal-bootstrap.result }}" \
            "${{ needs.true-fresh-install.result }}" \
            "${{ needs.true-fresh-modes.result }}" \
            "${{ needs.release-gate.result }}"; do
            if [ "$result" != "success" ]; then
              echo "release-candidate-gate FAIL: required job result '$result' (only success qualifies)" >&2
              exit 1
            fi
          done
          echo "release-candidate-gate prerequisites PASS"

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.candidate_commit }}
          persist-credentials: false

      - name: Ensure external checkout helper
        run: |
          set -euo pipefail
          if [[ ! -f scripts/checkout_external_repo.sh ]]; then
            mkdir -p scripts
            git fetch --quiet --depth=1 origin main
            git show FETCH_HEAD:scripts/checkout_external_repo.sh > scripts/checkout_external_repo.sh
            chmod +x scripts/checkout_external_repo.sh
          fi

      - name: Checkout external repo (retry)
        env:
          GH_TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN || github.token }}
        run: scripts/checkout_external_repo.sh "hello-yunshu/rill-xray-agent" "${{ inputs.canonical_commit }}" ".release-canonical"

      - name: Verify exact release qualification subject
        id: subject
        env:
          EXPECTED_CANDIDATE: ${{ inputs.candidate_commit }}
          EXPECTED_CANONICAL_COMMIT: ${{ inputs.canonical_commit }}
          EXPECTED_CANONICAL_DIGEST: ${{ inputs.canonical_digest }}
          EXPECTED_BUNDLE_SHA256: ${{ inputs.canonical_bundle_sha256 }}
        run: |
          set -euo pipefail
          actual_candidate=$(git rev-parse HEAD)
          [[ "$actual_candidate" == "$EXPECTED_CANDIDATE" ]]
          python3 .release-canonical/scripts/run_python_tests.py
          python3 .release-canonical/scripts/build_canonical_manifest.py --check
          python3 .release-canonical/scripts/verify_no_build_gate.py --root .release-canonical
          python3 .release-canonical/integrations/xray_bash_onekey/tools/verify_xray_payload.py \
            . .release-canonical/integrations/xray_bash_onekey/CANONICAL_MANIFEST.json \
            --expected-canonical-digest "$EXPECTED_CANONICAL_DIGEST"
          python3 - "$EXPECTED_CANONICAL_COMMIT" "$EXPECTED_CANONICAL_DIGEST" "$EXPECTED_BUNDLE_SHA256" <<'PY'
          import hashlib, json, pathlib, subprocess, sys
          commit, digest, bundle = sys.argv[1:]
          pin=json.loads(pathlib.Path('repository_files/rill_integration/RILL_CANONICAL_PIN.json').read_text())
          manifest=json.loads(pathlib.Path('.release-canonical/integrations/xray_bash_onekey/CANONICAL_MANIFEST.json').read_text())
          actual=hashlib.sha256(pathlib.Path('assets/rill-xray-agent-xray-bundle.tar.gz').read_bytes()).hexdigest()
          assert subprocess.check_output(['git','-C','.release-canonical','rev-parse','HEAD'],text=True).strip()==commit
          assert pin['canonicalCommit']==commit and pin['canonicalDigest']==digest
          assert manifest['canonicalDigest']==digest and manifest['bundleSha256']==bundle==actual
          PY
          {
            echo "candidate_commit=$actual_candidate"
            echo "canonical_commit=$EXPECTED_CANONICAL_COMMIT"
            echo "canonical_digest=$EXPECTED_CANONICAL_DIGEST"
            echo "canonical_bundle_sha256=$EXPECTED_BUNDLE_SHA256"
          } >> "$GITHUB_OUTPUT"
