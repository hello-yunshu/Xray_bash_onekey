# Preview qualification. Read-only repository permission, no tag/release step,
# and no release authority. The push trigger is scoped to the feature branch so
# this workflow can be executed before it exists on the default branch; remove
# it once the workflow is promoted.
name: Go preview qualification (NOT FOR RELEASE)

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - fix/go-parity-install-acme-closeout

permissions:
  contents: read

jobs:
  preview:
    if: github.ref_type != 'tag' && github.event_name != 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GOTOOLCHAIN: local
      GOPROXY: "off"
      # The reviewed release gate digest lives in workflow configuration, not in
      # a data file, so a contract edit cannot re-pin it. Update this value only
      # together with a reviewed change to check_release_gate.py.
      RELEASE_GATE_SHA256: d7493b289af919d9c38087176ff4fea8d4b8fbc5aae68bec792db9350e542564
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'

      - name: Use vendored modules when present
        run: |
          set -euo pipefail
          if [ -f vendor/modules.txt ]; then
            echo "GOFLAGS=-mod=vendor" >> "$GITHUB_ENV"
          fi

      - name: Install preview runtime prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nginx libnginx-mod-stream curl jq
          sudo systemctl start nginx
          arch=$(uname -m)
          case "$arch" in
            x86_64) asset=Xray-linux-64.zip ;;
            aarch64|arm64) asset=Xray-linux-arm64-v8a.zip ;;
            *) echo "unsupported runner arch $arch" >&2; exit 2 ;;
          esac
          curl -fsSL --retry 3 -o /tmp/xray.zip \
            "https://github.com/XTLS/Xray-core/releases/latest/download/$asset"
          python3 -m zipfile -e /tmp/xray.zip /tmp/xray
          # Hosted runners have no /opt/xray; install(1) does not create parents.
          sudo install -D -m 0755 /tmp/xray/xray /opt/xray/xray
          /opt/xray/xray version

      - name: Build the Go manager from this checkout
        run: |
          go build -trimpath -o "$RUNNER_TEMP/idleleo" ./cmd/idleleo
          chmod 0755 "$RUNNER_TEMP/idleleo"

      - name: Preview qualification (no release authority)
        env:
          IDLELEO_PREVIEW_EVIDENCE: ${{ runner.temp }}/preview-evidence
        run: |
          mkdir -p "$IDLELEO_PREVIEW_EVIDENCE"
          # The fixtures require root: they install real units, run systemd and
          # write /etc/idleleo and /var/lib/idleleo. Running the gate through sudo
          # changes only the caller identity; the gate's pass/fail rules and the
          # fixtures' root precondition stay untouched.
          sudo -E env "PATH=$PATH" "RELEASE_GATE_SHA256=$RELEASE_GATE_SHA256" \
            python3 tests/go-parity/parity/scripts/check_preview_gate.py \
            --go-bin "$RUNNER_TEMP/idleleo" \
            --bash-repo "$GITHUB_WORKSPACE" \
            --evidence "$IDLELEO_PREVIEW_EVIDENCE"

      - name: Upload preview evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-evidence
          path: ${{ runner.temp }}/preview-evidence
          if-no-files-found: warn
