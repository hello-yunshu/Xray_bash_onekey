# NEVER publishes. Official publishing must depend on its success.
# Expected RED until the real Go manager and F01-F28 executable tests exist.
#
# Zero runs so far: workflow_dispatch only appears on the repository's default
# branch, and this file lives on develop/go-native, so GitHub cannot dispatch it
# yet. The paths and package below were corrected against the real layout
# (module root = repo root, production package = internal/service); the gate
# returns exit 2 (28 PENDING + 28 missing tests), which is the intended result.
name: Go production parity release qualification
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-core-release-qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: current
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: hello-yunshu/Xray_bash_onekey
          ref: 4752f77c58028ac169c429fe7674c20060b30c9e
          path: legacy
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version: '1.23.2'
      - name: Execute provenance-checked native L0 and all 28 real feature tests
        env:
          # Explicit package must match the actual production Go module (repo root)
          # and its real service package; this is what the gate verifies.
          REQUIRED_PRODUCTION_PACKAGE: github.com/hello-yunshu/Xray_bash_onekey/internal/service
        run: |
          set -euo pipefail
          python3 current/tests/go-parity/parity/scripts/check_release_gate.py \
            --bash-repo legacy \
            --native-go-dir current \
            --native-package ./cmd/parity-adapter \
            --go-cli-package ./cmd/idleleo \
            --require-package "$REQUIRED_PRODUCTION_PACKAGE"
      # Subsequent mandatory jobs are still needed: VM + systemd, real Xray/Nginx,
      # cert renewal, cross-distro/arch, backup/import, SIGKILL reboot, staged release.
      # Do not publish on the basis of this one job alone.
