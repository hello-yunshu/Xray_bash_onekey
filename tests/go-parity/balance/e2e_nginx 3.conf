worker_processes 1;
pid /e2e/out/nginx.pid;
error_log /e2e/out/nginx-error.log notice;
load_module /usr/lib/nginx/modules/ngx_stream_module.so;
events { worker_connections 512; }
include /etc/idleleo/conf/nginx/00-xray.conf;
# ssl_reject_handshake belongs to ngx_http_ssl_module: the Bash isolate site is
# included from the http block, never from stream.
http {
    include /etc/idleleo/conf/nginx/03-isolate.conf;
}
