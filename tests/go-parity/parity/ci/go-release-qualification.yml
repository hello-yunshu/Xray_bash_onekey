# Copy to .github/workflows/go-release-qualification.yml ONLY after reviewing module path.
# This workflow NEVER publishes. Official publishing must depend on its success.
# Expected RED until real Go manager, source-built native adapter and F01–F28 L1–L3 exist.
name: Go production parity release qualification
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-core-release-qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: current
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: hello-yunshu/Xray_bash_onekey
          ref: 0fa7052e51b9bd7e6ffb46bc86befb006034da3c
          path: legacy
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version: '1.23.2'
      - name: Execute provenance-checked native L0 and all 28 real feature tests
        env:
          # Explicit package must match actual production Go module when implemented.
          REQUIRED_PRODUCTION_PACKAGE: github.com/hello-yunshu/Xray_bash_onekey/go/internal/manager
        run: |
          set -euo pipefail
          python3 current/tests/go-parity/parity/scripts/check_release_gate.py \
            --bash-repo legacy \
            --native-go-dir current/go \
            --native-package ./cmd/parity-adapter \
            --go-cli-package ./cmd/idleleo \
            --require-package "$REQUIRED_PRODUCTION_PACKAGE"
      # Subsequent mandatory jobs are still needed: VM + systemd, real Xray/Nginx,
      # cert renewal, cross-distro/arch, backup/import, SIGKILL reboot, staged release.
      # Do not publish on the basis of this one job alone.
