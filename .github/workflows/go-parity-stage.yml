# Copy to .github/workflows/go-parity-stage.yml only after integrating tests/go-parity/.
# Phase 00/01 required PR gate: does not claim L1-L3 business/release parity.
name: Go parity stage gate
on:
  push:
    branches:
      - develop/go-native
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stage-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GOTOOLCHAIN: local
      GOPROXY: "off"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: current
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: hello-yunshu/Xray_bash_onekey
          ref: 0fa7052e51b9bd7e6ffb46bc86befb006034da3c
          path: legacy
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version: '1.27.4'
      - name: Use vendored modules when present
        run: |
          set -euo pipefail
          for d in . current; do
            if [ -f "$d/vendor/modules.txt" ]; then
              echo "GOFLAGS=-mod=vendor" >> "$GITHUB_ENV"
              break
            fi
          done
      - name: Evidence hygiene (no host paths, public addresses or user names)
        run: |
          set -euo pipefail
          python3 current/tests/go-parity/parity/scripts/check_evidence_hygiene.py current/tests/go-parity/evidence current/tests/go-parity/parity/evidence
      - name: Go core formatting, vet, tests and build
        run: |
          set -euo pipefail
          cd current
          test -z "$(gofmt -l cmd internal)"
          go vet ./...
          go test ./...
          go build -trimpath -o /tmp/idleleo ./cmd/idleleo
      - name: Feature ledger transition policy (positive and negative cases)
        run: |
          set -euo pipefail
          python3 current/.github/test/test_ledger_transition.py
      - name: Refuse forbidden ledger transitions against the PR base
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git -C current fetch --no-tags --depth=1 origin "$GITHUB_BASE_REF"
          base=$(mktemp)
          git -C current show "FETCH_HEAD:tests/go-parity/parity/cases/feature_contracts.json" > "$base"
          python3 current/tests/go-parity/parity/scripts/check_ledger_transition.py \
            --base "$base" \
            --head current/tests/go-parity/parity/cases/feature_contracts.json \
            --root current
      - name: A2 comparator mutation self-test and committed-runtime compare
        run: |
          set -euo pipefail
          python3 current/tests/go-parity/a2/compare_real_runtime.py --self-test
          python3 current/tests/go-parity/a2/compare_real_runtime.py \
            --evidence current/tests/go-parity/evidence/a2-2026-11-08 \
            --go-bin /tmp/idleleo --out /tmp/a2-compare.json
      - name: Native Go L0 against the pinned Bash baseline
        run: |
          set -euo pipefail
          python3 current/tests/go-parity/parity/scripts/run_parity.py \
            --bash-repo legacy \
            --native-go-dir "$GITHUB_WORKSPACE/current" \
            --native-package ./cmd/parity-adapter \
            --require-package github.com/hello-yunshu/Xray_bash_onekey/internal/compat \
            --require-native-l0 --evidence /tmp/phase01-native-l0
      - name: Fixed clean Bash baseline + Go demo L0 + Go Bridge and negative cases
        run: |
          set -euo pipefail
          python3 current/tests/go-parity/parity/scripts/run_stage_gate.py --bash-repo legacy
      - name: Keep production release eligibility separate
        run: echo 'Stage smoke passed; 28 production Go contracts remain independent, red until implemented.'
